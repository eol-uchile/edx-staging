name: Generate Diagram
on:
  push:
    branches:
      - 'openuchile-release/**'
      - 'eol-release/**'
    paths:
      - 'Dockerfile'
      - 'requirements/**.txt'
      - '.github/workflows/diagram.yml'
      - 'templates/diagram_template.j2'
      - 'themes/**'
      - '.gitmodules'
      - 'gen_deps_diagram.py'

# Required for the workflow to be reused by other repositories.
  workflow_call:
    secrets:
      private_key:
        required: true
    inputs:
      app_id:
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate_diagram:
    runs-on: ubuntu-latest
    name: PlantUML Diagram
    steps:

    - name: Create GitHub App Token
      id: app_token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app_id || vars.EOLITO_BOT_APP_ID }}
        private-key: ${{ secrets.private_key || secrets.EOLITO_BOT_PRIVATE_KEY }}

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: 'recursive'
        token: ${{ steps.app_token.outputs.token }} # create-github-app-token@v2 generates at runtime a short-lived token for the App (eolito-bot) with the defined permissions.

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Jinja2==3.0.3
      shell: bash

    - name: Create templates directory
      run: test -d templates || mkdir templates

    - name: Download template
      run: wget https://github.com/eol-uchile/edx-staging/raw/eol-release/koa/templates/diagram_template.j2 -O templates/diagram_template.j2

    - name: Download diagram generator script
      run: wget https://github.com/eol-uchile/edx-staging/raw/eol-release/koa/gen_deps_diagram.py -O gen_deps_diagram.py

    - name: Generate diagram.puml
      run: python gen_deps_diagram.py

    - name: Draw diagram
      uses: Timmy/plantuml-action@v1
      with:
        args: '-tsvg diagrams/diagram.puml'

    - name: Configure Git
      run: |
        git config user.name "eolito[bot]"
        git config user.email "217098583+eolito[bot]@users.noreply.github.com"

    - name: Commit UML Images
      run: |
        if [ "$(git status --porcelain diagrams/)" != "" ]
        then
          git add diagrams/**
          git commit -m "chore: Auto-generate UML diagram"
          git push
        else
          echo "No changes to commit. Skipping commit step."
        fi
